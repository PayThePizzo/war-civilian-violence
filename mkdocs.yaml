site_name: "War Civilian Violence"
site_description: "Analysis of UCDP Georeferenced Event Dataset (GED) with respect to Patterns of One-Sided Violence in the Sudan Conflict"
site_author: "Gianmaria Pizzo"
site_url: "https://github.com/PayThePizzo/war-civilian-violence"
repo_name: "PayThePizzo/war-civilian-violence"
repo_url: "https://github.com/PayThePizzo/war-civilian-violence"

watch: [mkdocs.yml, README.md, scripts, notebooks]

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

nav:
- Home: index.md
# TODO: Complete the "Getting Started" section with the following pages:
- Getting Started:
