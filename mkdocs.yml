site_name: "War Civilian Violence"
site_description: "Analysis of UCDP Georeferenced Event Dataset (GED) with respect to Patterns of One-Sided Violence in the Sudan Conflict"
site_author: "Gianmaria Pizzo"
site_url: "https://github.com/PayThePizzo/war-civilian-violence"
repo_name: "PayThePizzo/war-civilian-violence"
repo_url: "https://github.com/PayThePizzo/war-civilian-violence"

watch: [mkdocs.yml, README.md, scripts, config, docs]

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

nav:
- Home: index.md 
- Getting Started:
  - Installation: getting_started/installation.md
  - Configuration: getting_started/configuration.md
  - Usage: getting_started/usage.md
# - Project Technical Details:                              # Technical details of the project
- Phase 1 - Dataset: phase_1/dataset.md                     # Report/Deliverables for Phase 1
- Phase 2 - Domain Knowledge: phase_2/domain_knowledge.md   # Report/Deliverables for Phase 2
- Phase 3 - Visual Design:                                  # Report/Deliverables for Phase 3
  - Project Intro and Idea: phase_3/idea.md
  - Methodology: phase_3/methodology.md
  - Design Decisions: phase_3/design_decisions.md
  - Web Visualizations: phase_3/web_visualizations.md
  - Social Media Visualizations: phase_3/social_posts.md
- Phase 4 - Tangible Design: phase_4/tangible_design.md     # Report/Deliverables for Phase 4
- Python Scripts Reference:                                 # Documentation for Python Scripts
  - Overview: reference/index.md
  - 01_clean_events.py: reference/01_clean_events.md
  - 02_build_actor_events.py: reference/02_build_actor_events.md
  - 03_build_weekly_metrics.py: reference/03_build_weekly_metrics.md
  - 04_build_h3_metrics.py: reference/04_build_h3_metrics.md
  - 05_build_actor_profiles.py: reference/05_build_actor_profiles.md
  - 06_build_event_windows.py: reference/06_build_event_windows.md
  - 07_validate_outputs.py: reference/07_validate_outputs.md
  - build_all.py: reference/build_all.md
# - Python Tests Reference:                                 # Documentation for Python Tests

theme:
  name: dracula
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.b64
  - pymdownx.betterem
  - pymdownx.blocks.admonition
  - pymdownx.blocks.definition
  - pymdownx.blocks.details
  - pymdownx.blocks.html
  - pymdownx.blocks.tab
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.escapeall
  - pymdownx.extra
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.pathconverter
  - pymdownx.progressbar
  - pymdownx.saneheaders
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.striphtml
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed
  - pymdownx.tasklist
  - pymdownx.tilde

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
- search
- autorefs
# - macros
- mermaid2
# - panzoom
# - mkdocs-video
- mkdocstrings:
    enabled: true
    handlers:
      python:
        setup_commands:
          - import sys
          - sys.path.append("scripts")
          - sys.path.append("config")
        import:
        - https://docs.python-requests.org/en/master/objects.inv
        - https://docs.python.org/3/objects.inv
        - https://mkdocstrings.github.io/objects.inv
        - https://mkdocstrings.github.io/autorefs/objects.inv
        - https://mkdocstrings.github.io/griffe/objects.inv
        - https://python-markdown.github.io/objects.inv
        paths: [scripts, config, .]
        options:
          docstring_options:
            ignore_init_summary: true
          docstring_style: google
          docstring_section_style: list
          heading_level: 2
          inherited_members: true
          merge_init_into_class: true
          parameter_headings: true
          separate_signature: true
          show_bases: false
          show_inheritance_diagram: false
          show_root_heading: true
          show_root_full_path: false
          show_source: true
          show_signature_annotations: true
          show_symbol_type_heading: true
          show_symbol_type_toc: true
          signature_crossrefs: true
          summary: true